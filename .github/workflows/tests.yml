# Runs on every push: builds the search database from data/ and checks search quality.
# No AI calls and no API keys are needed.
name: Search quality check

on:
  push:
  pull_request:

jobs:
  search-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check that search finds the right page
        run: python eval/ci_check.py
